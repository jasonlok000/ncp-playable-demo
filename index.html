:root {
  --teal: #1E927A;
  --teal-dark: #167562;
  --blue: #075E9C;
  --navy: #0F3146;
  --gold: #F3B100;
  --mint: #E9F4F2;
  --cream: #FFFFE0;
  --white: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: linear-gradient(180deg, var(--mint) 0%, var(--mint) 45%, var(--cream) 100%);
  font-family: "Poppins", "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--navy);
  user-select: none; -webkit-user-select: none;
  touch-action: none; overscroll-behavior: none;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud button { pointer-events: auto; }

/* ---------- top bar ---------- */
#topbar {
  position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px;
  display: flex; align-items: center; gap: 8px;
}
#logo { width: 40px; height: 40px; border-radius: 10px; background: var(--white); box-shadow: 0 2px 6px rgba(15,49,70,.15); }
#pts {
  display: flex; align-items: center; gap: 6px;
  background: var(--white); border-radius: 999px; padding: 4px 14px 4px 6px;
  box-shadow: 0 2px 6px rgba(15,49,70,.15); font-weight: 800; font-size: 18px;
  transition: transform .08s;
}
#pts.bump { transform: scale(1.12); }
#pts .coin { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFE27A, var(--gold) 60%, #C98F00); border: 2px solid #C98F00; }
#pts .lbl { font-size: 12px; font-weight: 600; opacity: .6; }
.spacer { flex: 1; }
#mute {
  width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--white);
  box-shadow: 0 2px 6px rgba(15,49,70,.15); font-size: 16px; cursor: pointer;
}
#getBtn {
  height: 36px; padding: 0 14px; border: none; border-radius: 999px; cursor: pointer;
  background: var(--teal); color: var(--white); font: 800 14px "Poppins", sans-serif;
  box-shadow: 0 2px 6px rgba(15,49,70,.25);
}

/* ---------- goal card ---------- */
#goal {
  position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 52px); left: 12px; right: 12px;
  display: flex; align-items: center; gap: 12px;
  background: var(--white); border-radius: 16px; padding: 8px 14px 8px 8px;
  box-shadow: 0 3px 10px rgba(15,49,70,.12); border: 2px solid rgba(15,49,70,.08);
  transition: transform .15s;
}
#goal.pop { transform: scale(1.05); }
#goalImg { width: 78px; height: 49px; border-radius: 6px; flex: none; }
#goal .gtext { flex: 1; min-width: 0; }
#goal .glabel { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--teal); }
#goalName { font-size: 15px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#goal .bar { margin-top: 5px; height: 10px; border-radius: 99px; background: #DDEBE8; overflow: hidden; }
#barFill { height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--teal), #2BC49B); transition: width .15s; }

/* ---------- wallet ---------- */
#wallet {
  position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); left: 12px; right: 12px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
#wallet .wl { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--navy); opacity: .55; margin-right: 2px; }
#wallet .slot {
  width: 58px; height: 37px; border-radius: 6px; border: 2px dashed rgba(15,49,70,.2);
  background-size: cover; background-position: center;
}
#wallet .slot.filled { border: none; box-shadow: 0 2px 6px rgba(15,49,70,.25); animation: slotIn .35s ease-out; }
@keyframes slotIn { from { transform: scale(1.6); } to { transform: scale(1); } }

/* ---------- headline ---------- */
#headline {
  position: absolute; left: 0; right: 0; text-align: center;
  font-weight: 800; font-size: 26px; line-height: 1.15; color: var(--navy);
  text-shadow: 0 2px 0 var(--white); transition: opacity .4s;
}
#headline span { color: var(--teal); }
#headline.hide { opacity: 0; }

/* ---------- end card ---------- */
#end {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(15,49,70,.55); padding: 16px; opacity: 0; pointer-events: none; transition: opacity .35s;
}
#end.show { opacity: 1; pointer-events: auto; }
#end .panel {
  width: 100%; max-width: 380px; max-height: 100%; overflow: auto;
  background: linear-gradient(180deg, var(--white) 0%, var(--mint) 100%);
  border-radius: 24px; padding: 18px 18px 12px; text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,.3); transform: scale(.85); transition: transform .4s cubic-bezier(.2,1.4,.4,1);
}
#end.show .panel { transform: scale(1); }
#end .elogo { width: 56px; height: 56px; border-radius: 12px; }
#endTitle { font-size: 24px; font-weight: 800; line-height: 1.2; margin: 6px 0 10px; }
#endTitle em { font-style: normal; color: var(--teal); }
#endSub { font-size: 14px; font-weight: 600; margin: -4px 0 10px; opacity: .8; }
#endWallet { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
#endWallet img { width: 70px; height: 44px; border-radius: 6px; box-shadow: 0 2px 6px rgba(15,49,70,.25); }
#endWallet img.locked { filter: grayscale(1); opacity: .35; box-shadow: none; }
.how-title { font-size: 13px; font-weight: 800; color: var(--blue); }
.how { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 10px; font-weight: 800; font-size: 13px; }
.how .step { background: var(--white); border-radius: 12px; padding: 6px 10px; box-shadow: 0 2px 6px rgba(15,49,70,.12); }
.how .step b { display: block; font-size: 22px; line-height: 1.2; }
.how .arr { color: var(--teal); font-size: 18px; }
#nextGoal { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
#cta {
  width: 100%; height: 58px; border: none; border-radius: 16px; cursor: pointer;
  background: var(--teal); color: var(--white); font: 800 20px "Poppins", sans-serif;
  box-shadow: 0 5px 0 var(--teal-dark), 0 8px 18px rgba(30,146,122,.45);
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
#playBtn {
  width: 100%; height: 46px; margin-bottom: 10px; border-radius: 14px; cursor: pointer;
  background: var(--white); color: var(--teal); border: 3px solid var(--teal); font: 800 17px "Poppins", sans-serif;
}
.proof { font-size: 12px; font-weight: 600; margin-top: 10px; opacity: .75; }
.proof .stars { color: var(--gold); }
#replay { margin-top: 6px; background: none; border: none; font: 600 13px "Poppins", sans-serif; color: var(--blue); cursor: pointer; padding: 4px 10px; }
.disc { font-size: 10px; line-height: 1.35; opacity: .55; margin-top: 4px; }
.hidden { display: none !important; }

/* ---------- landscape ---------- */
@media (orientation: landscape) and (max-height: 540px) {
  #goal { right: auto; width: 300px; }
  #wallet { left: auto; right: 12px; bottom: auto; top: calc(max(10px, env(safe-area-inset-top)) + 52px); flex-direction: column; }
  #headline { font-size: 22px; }
  #end .panel { max-width: 560px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; align-items: center; padding: 14px 18px 10px; }
  #end .panel > .col { min-width: 0; }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

(function () {

  // ---------------------------------------------------------------- config

  // ---------------------------------------------------------------- helpers
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutBack = (t) => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const easeOutBounce = (t) => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  };
  const rewardLabel = (r) => "$" + r.value + " " + r.name + " card";
  const rectCenter = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height }; };

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  // ---------------------------------------------------------------- audio (synthesized, starts on first touch)
  const AC = window.AudioContext || window.webkitAudioContext;
  let ac = null, master = null, muted = false;

  function unlockAudio() {
    if (!AC) return;
    if (!ac) {
      ac = new AC();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.5;
      master.connect(ac.destination);
    }
    if (ac.state === "suspended") ac.resume();
  }

  function tone(freq, dur, type, vol, when, slideTo) {
    if (!ac) return;
    const t0 = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function noise(dur, vol, freq, when) {
    if (!ac) return;
    const t0 = ac.currentTime + (when || 0);
    const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0);
  }

  function openStore() {

    const url = ios ? CONFIG.storeIOS : CONFIG.storeAndroid;
    try {
      if (window.FbPlayableAd && window.FbPlayableAd.onCTAClick) return window.FbPlayableAd.onCTAClick();
      if (window.ExitApi && window.ExitApi.exit) return window.ExitApi.exit();
      if (window.mraid && window.mraid.open) return window.mraid.open(url);
    } catch (e) { /* fall through to plain link */ }
    window.open(url, "_blank");
  }

  // ---------------------------------------------------------------- layout
  let W = 0, H = 0, dpr = 1, S = 0, itemSize = 80, itemR = 36;
  const L = {}; // layout values

  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    S = Math.min(W, H);
    itemSize = clamp(S * 0.24, 70, 130);
    itemR = itemSize * 0.45;
    spriteCache = {};

    const landscape = W > H && H <= 540;
    const top = $("topbar").getBoundingClientRect();
    const goal = goalEl.getBoundingClientRect();
    const wal = walletEl.getBoundingClientRect();
    L.landscape = landscape;
    L.playTop = (landscape ? top.bottom : goal.bottom) + 8;
    L.bagW = clamp(S * 0.42, 120, 210);
    L.bagH = L.bagW * 0.62;
    L.bagX = W / 2;
    L.bagBottom = landscape ? H - 6 : wal.top - 6;
    L.bagTop = L.bagBottom - L.bagH;
    L.playBottom = L.bagTop;
    L.ph = L.playBottom - L.playTop;
    L.introY = L.playTop + L.ph * 0.56;
    headline.style.top = (landscape ? goal.bottom + 8 : L.playTop + 6) + "px";
  }

  // ---------------------------------------------------------------- item art (drawn in code, cached as sprites)
  function barcode(c, cx, cy, w, h, lw) {
    rr(c, cx - w / 2, cy - h / 2, w, h, h * 0.15);
    c.fillStyle = "#fff"; c.fill();
    c.lineWidth = lw * 0.5; c.strokeStyle = "rgba(15,49,70,.35)"; c.stroke();
    const pat = [2, 1, 1, 2, 1, 3, 1, 1, 2, 1, 1, 2, 3, 1, 1, 2, 1, 1, 2, 1, 3, 1, 2];
    const total = pat.reduce((a, b) => a + b, 0);
    const u = (w * 0.84) / total;
    let x = cx - w * 0.42;
    c.fillStyle = "#111";
    for (let i = 0; i < pat.length; i++) {
      if (i % 2 === 0) c.fillRect(x, cy - h * 0.34, pat[i] * u, h * 0.68);
      x += pat[i] * u;
    }
  }

  function txt(c, t, x, y, size, color) {
    c.fillStyle = color; c.font = "800 " + size + "px " + FONT;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText(t, x, y);
  }

  const ITEMS = {
    milk(c, s, lw) {
      const w = s * 0.46, h = s * 0.6, x = -w / 2, y = -s * 0.22;
      rr(c, -w * 0.3, y - s * 0.27, w * 0.6, s * 0.08, 2); c.fillStyle = "#fff"; c.fill(); c.stroke();
      c.beginPath(); c.moveTo(x, y); c.lineTo(-w * 0.3, y - s * 0.2); c.lineTo(w * 0.3, y - s * 0.2); c.lineTo(x + w, y); c.closePath();
      c.fillStyle = "#DCE9F5"; c.fill(); c.stroke();
      rr(c, x, y, w, h, s * 0.03); c.fillStyle = "#fff"; c.fill(); c.stroke();
      c.fillStyle = "#18B8EC"; c.fillRect(x + lw / 2, y + h * 0.08, w - lw, h * 0.28);
      txt(c, "MILK", 0, y + h * 0.22, s * 0.11, "#fff");
      barcode(c, 0, y + h * 0.7, w * 0.78, h * 0.3, lw);
    },
    cereal(c, s, lw) {
      const w = s * 0.56, h = s * 0.74, x = -w / 2, y = -h / 2;
      rr(c, x, y, w, h, s * 0.03); c.fillStyle = "#E86C24"; c.fill(); c.stroke();
      c.beginPath(); c.arc(0, y + h * 0.44, w * 0.27, 0, Math.PI * 2); c.fillStyle = "#FFD54F"; c.fill();
      c.fillStyle = "#C9761E";
      [[-0.1, 0.4], [0.08, 0.38], [0, 0.48], [-0.12, 0.5], [0.12, 0.48]].forEach(([a, b]) => { c.beginPath(); c.arc(w * a, y + h * b, w * 0.05, 0, Math.PI * 2); c.fill(); });
      txt(c, "CEREAL", 0, y + h * 0.13, s * 0.095, "#fff");
      barcode(c, 0, y + h * 0.82, w * 0.7, h * 0.2, lw);
    },
    juice(c, s, lw) {
      rr(c, -s * 0.09, -s * 0.33, s * 0.18, s * 0.15, s * 0.03); c.fillStyle = "#F09838"; c.fill(); c.stroke();
      rr(c, -s * 0.11, -s * 0.41, s * 0.22, s * 0.1, s * 0.03); c.fillStyle = "#1E927A"; c.fill(); c.stroke();
      rr(c, -s * 0.2, -s * 0.21, s * 0.4, s * 0.6, s * 0.09); c.fillStyle = "#F09838"; c.fill(); c.stroke();
      c.fillStyle = "#fff"; c.fillRect(-s * 0.2 + lw / 2, -s * 0.08, s * 0.4 - lw, s * 0.42);
      txt(c, "JUICE", 0, s * 0.03, s * 0.095, "#E05024");
      barcode(c, 0, s * 0.23, s * 0.3, s * 0.14, lw);
    },
    soup(c, s, lw) {
      const w = s * 0.5, h = s * 0.58, x = -w / 2, y = -h / 2, ry = s * 0.06;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + h); c.ellipse(0, y + h, w / 2, ry, 0, Math.PI, 0, true); c.lineTo(x + w, y); c.closePath();
      c.fillStyle = "#C12125"; c.fill(); c.stroke();
      c.fillStyle = "#fff"; c.fillRect(x + lw / 2, y + h * 0.24, w - lw, h * 0.5);
      txt(c, "SOUP", 0, y + h * 0.36, s * 0.11, "#C12125");
      barcode(c, 0, y + h * 0.6, w * 0.6, h * 0.18, lw);
      c.beginPath(); c.ellipse(0, y, w / 2, ry, 0, 0, Math.PI * 2); c.fillStyle = "#C9D1D8"; c.fill(); c.stroke();
    },
    pasta(c, s, lw) {
      const w = s * 0.64, h = s * 0.6, x = -w / 2, y = -h / 2;
      rr(c, x, y, w, h, s * 0.03); c.fillStyle = "#1874B8"; c.fill(); c.stroke();
      rr(c, x + w * 0.12, y + h * 0.3, w * 0.76, h * 0.3, s * 0.04); c.fillStyle = "#FFF3C4"; c.fill();
      c.strokeStyle = "#E8B23A"; c.lineWidth = lw * 1.2; c.lineCap = "round";
      for (let i = 0; i < 6; i++) { const px = x + w * (0.2 + i * 0.12); c.beginPath(); c.moveTo(px, y + h * 0.37); c.lineTo(px + w * 0.05, y + h * 0.53); c.stroke(); }
      c.strokeStyle = "#0F3146"; c.lineWidth = lw;
      txt(c, "PASTA", 0, y + h * 0.16, s * 0.1, "#fff");
      barcode(c, 0, y + h * 0.8, w * 0.52, h * 0.22, lw);
    },
    chips(c, s, lw) {
      const w = s * 0.58, h = s * 0.74, x = -w / 2, y = -h / 2, n = 6, z = s * 0.035;
      c.beginPath(); c.moveTo(x, y);
      for (let i = 1; i <= n; i++) c.lineTo(x + (w * i) / n, y + (i % 2 ? z : 0));
      c.quadraticCurveTo(x + w + s * 0.05, 0, x + w, y + h);
      for (let i = n - 1; i >= 0; i--) c.lineTo(x + (w * i) / n, y + h - (i % 2 ? z : 0));
      c.quadraticCurveTo(x - s * 0.05, 0, x, y);
      c.closePath(); c.fillStyle = "#FFC928"; c.fill(); c.stroke();
      c.beginPath(); c.ellipse(0, y + h * 0.42, w * 0.36, h * 0.17, 0, 0, Math.PI * 2); c.fillStyle = "#E05024"; c.fill();
      txt(c, "CHIPS", 0, y + h * 0.42, s * 0.1, "#fff");
      barcode(c, 0, y + h * 0.77, w * 0.5, h * 0.16, lw);
    },
    detergent(c, s, lw) {
      rr(c, -s * 0.2, -s * 0.36, s * 0.16, s * 0.14, s * 0.03); c.fillStyle = "#1E927A"; c.fill(); c.stroke();
      rr(c, -s * 0.26, -s * 0.24, s * 0.52, s * 0.62, s * 0.09); c.fillStyle = "#6A3FB5"; c.fill(); c.stroke();
      rr(c, s * 0.05, -s * 0.17, s * 0.13, s * 0.09, s * 0.04); c.fillStyle = "#E9F4F2"; c.fill(); c.stroke();
      rr(c, -s * 0.2, -s * 0.03, s * 0.4, s * 0.33, s * 0.04); c.fillStyle = "#fff"; c.fill();
      txt(c, "CLEAN", 0, s * 0.05, s * 0.095, "#6A3FB5");
      barcode(c, 0, s * 0.2, s * 0.3, s * 0.12, lw);
    },
  };
  const ITEM_TYPES = Object.keys(ITEMS);

  let spriteCache = {};
  function sprite(type, golden) {
    const key = type + (golden ? "_g" : "");
    if (spriteCache[key]) return spriteCache[key];
    const size = Math.ceil(itemSize * 1.15);
    const cnv = document.createElement("canvas");
    cnv.width = cnv.height = Math.ceil(size * dpr);
    const c = cnv.getContext("2d");
    c.scale(dpr, dpr);
    c.translate(size / 2, size / 2);
    const lw = Math.max(2, itemSize * 0.03);
    c.lineWidth = lw; c.strokeStyle = "#0F3146"; c.lineJoin = "round";
    ITEMS[type](c, itemSize, lw);
    if (golden) {
      c.globalCompositeOperation = "source-atop";
      c.fillStyle = "rgba(255,196,0,.5)";
      c.fillRect(-size / 2, -size / 2, size, size);
    }
    return (spriteCache[key] = { cnv, size });
  }

  // ---------------------------------------------------------------- gift cards (canvas art reused in the DOM)
  const CARD_W = 300, CARD_H = 189;

  function drawCard(c, r, locked) {
    const w = CARD_W, h = CARD_H;
    rr(c, 0, 0, w, h, h * 0.1);
    const g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, locked ? "#9AA5AD" : r.c1);
    g.addColorStop(1, locked ? "#C9D1D8" : r.c2);
    c.fillStyle = g; c.fill();
    c.save(); rr(c, 0, 0, w, h, h * 0.1); c.clip();
    c.fillStyle = "rgba(255,255,255,.18)";
    c.beginPath(); c.moveTo(w * 0.55, 0); c.lineTo(w * 0.78, 0); c.lineTo(w * 0.48, h); c.lineTo(w * 0.25, h); c.closePath(); c.fill();
    c.restore();
    c.textAlign = "left"; c.textBaseline = "top";
    c.fillStyle = "rgba(255,255,255,.92)"; c.font = "800 " + h * 0.1 + "px " + FONT;
    c.fillText("NCP REWARDS", w * 0.07, h * 0.1);
    c.textAlign = "right"; c.font = h * 0.34 + "px " + EMOJI_FONT;
    c.fillText(locked ? "🔒" : r.icon, w * 0.94, h * 0.06);
    c.textAlign = "left"; c.textBaseline = "alphabetic"; c.fillStyle = "#fff";
    c.font = "800 " + h * 0.38 + "px " + FONT;
    c.fillText("$" + r.value, w * 0.07, h * 0.74);
    c.font = "800 " + h * 0.09 + "px " + FONT;
    c.fillText(r.name === "Gift" ? "GIFT CARD" : r.name.toUpperCase() + " GIFT CARD", w * 0.07, h * 0.9);
    rr(c, 2, 2, w - 4, h - 4, h * 0.1);
    c.lineWidth = 4; c.strokeStyle = r.gold && !locked ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.35)"; c.stroke();
  }

  function drawCardBack(c) {
    const w = CARD_W, h = CARD_H;
    rr(c, 0, 0, w, h, h * 0.1);
    const g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#075E9C"); g.addColorStop(1, "#1E927A");
    c.fillStyle = g; c.fill();
    if (logoImg.complete) {
      rr(c, w / 2 - h * 0.3, h * 0.2, h * 0.6, h * 0.6, h * 0.1); c.fillStyle = "#fff"; c.fill();
      c.drawImage(logoImg, w / 2 - h * 0.28, h * 0.22, h * 0.56, h * 0.56);
    }
  }

  function makeCanvas(draw) {
    const cnv = document.createElement("canvas");
    cnv.width = CARD_W * 2; cnv.height = CARD_H * 2;
    const c = cnv.getContext("2d");
    c.scale(2, 2);
    draw(c);
    return cnv;
  }

  const cards = { front: [], locked: [], url: [], lockedUrl: [], back: null, tease: null, teaseUrl: "" };
  function buildCards() {
    REWARDS.forEach((r, i) => {
      cards.front[i] = makeCanvas((c) => drawCard(c, r, false));
      cards.locked[i] = makeCanvas((c) => drawCard(c, r, true));
      cards.url[i] = cards.front[i].toDataURL();
      cards.lockedUrl[i] = cards.locked[i].toDataURL();
    });
    cards.back = makeCanvas(drawCardBack);
    cards.tease = makeCanvas((c) => drawCard(c, NEXT_TEASE, true));
    cards.teaseUrl = cards.tease.toDataURL();
  }

  // ---------------------------------------------------------------- state
  let st;
  function reset() {
    st = {
      mode: "intro", time: st ? st.time : 0,
      introT: 0, interacted: false, demoDone: false, respawnAt: 0.35,
      playStart: 0, lastInput: 0,
      tier: 0, points: 0, shown: 0, display: 0, unlocked: [],
      items: [], pending: [], coins: [], texts: [], confetti: [], sparks: [],
      trail: [], stroke: null, nextWave: 0, goldenShown: false, firstScan: true,
      hand: null, shake: 0, bagPop: 0, unl: null, fin: null,
    };
    slots.forEach((s) => { s.classList.remove("filled"); s.style.backgroundImage = ""; });
    headline.classList.remove("hide");
    endEl.classList.remove("show");
    updateGoal();
  }

  function updateGoal() {
    const r = REWARDS[Math.min(st.tier, REWARDS.length - 1)];
    goalImg.src = cards.url[Math.min(st.tier, REWARDS.length - 1)] || "";
    goalName.textContent = st.tier < REWARDS.length ? rewardLabel(r) : "All rewards unlocked!";
    goalEl.classList.add("pop");
    setTimeout(() => goalEl.classList.remove("pop"), 160);
  }

  // ---------------------------------------------------------------- spawning
  function throwItem(o) {
    const x0 = L.bagX + rand(-L.bagW * 0.22, L.bagW * 0.22);
    const y0 = L.bagTop + itemSize * 0.35;
    const apexY = o.apexY != null ? o.apexY : rand(L.playTop + L.ph * 0.1, L.playTop + L.ph * 0.42);
    const T = o.apexT;
    const g = (2 * (y0 - apexY)) / (T * T);
    const margin = itemSize * 0.7;
    const tx = o.x != null ? o.x : rand(margin, W - margin);
    st.items.push({
      type: ITEM_TYPES[randInt(0, ITEM_TYPES.length - 1)],
      x: x0, y: y0, vx: (tx - x0) / T, vy: -g * T, g,
      rot: rand(-0.3, 0.3), vr: o.hover ? rand(-0.6, 0.6) : rand(-1.6, 1.6),
      golden: !!o.golden, hover: !!o.hover, hoverY: apexY,
      state: "fly", t: 0, value: 0,
    });
    st.bagPop = 1;
    sfx.whoosh();
  }

  function launchWave() {
    const tier = TIERS[st.tier];
    const k = randInt(tier.wave[0], tier.wave[1]);
    let goldenIdx = -1;
    if (tier.golden > 0 && (!st.goldenShown || Math.random() < tier.golden)) { goldenIdx = randInt(0, k - 1); st.goldenShown = true; }
    // spread targets across the width so multi-item waves line up for a swipe
    const span = W - itemSize * 1.6;
    for (let i = 0; i < k; i++) {
      const x = k === 1 ? null : itemSize * 0.8 + span * ((i + rand(0.2, 0.8)) / k);
      st.pending.push({ delay: i * 0.12, apexT: tier.apexT, golden: i === goldenIdx, x });
    }
  }

  // ---------------------------------------------------------------- scanning
  function scanItem(it, demo) {
    if (it.state !== "fly" && it.state !== "hover") return;
    it.state = "scan"; it.t = 0;
    const tier = TIERS[Math.min(st.tier, TIERS.length - 1)];
    let mult = 1;
    if (!demo && st.stroke) { st.stroke.count++; mult = Math.min(st.stroke.count, 4); }
    const base = it.golden ? Math.max(500, tier.per * 2) : tier.per;
    it.value = base * mult;
    st.points += it.value;
    addText("+" + it.value, it.x, it.y - itemR * 1.1, itemSize * (it.golden ? 0.42 : 0.34), it.golden ? "#F3B100" : "#1E927A");
    sfx.beep();
    if (mult >= 2) {
      addText(PRAISE[mult], clamp(it.x, W * 0.3, W * 0.7), it.y - itemR * 2, itemSize * 0.4, "#fff", true);
      sfx.combo(mult);
    }
    if (it.golden) { addText("Golden bonus!", clamp(it.x, W * 0.3, W * 0.7), it.y + itemR * 1.4, itemSize * 0.3, "#F3B100", true); sfx.golden(); }
    st.shake = Math.max(st.shake, st.firstScan ? 9 : it.golden ? 7 : 3);
  }

  function burstItem(it) {
    const n = st.firstScan ? 12 : it.golden ? 10 : 6;
    st.firstScan = false;
    const tgt = rectCenter(ptsEl.querySelector(".coin"));
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(80, 220);
      st.coins.push({
        x: it.x, y: it.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
        t: 0, delay: i * 0.03, tx: tgt.x, ty: tgt.y,
        value: i === n - 1 ? it.value - Math.floor(it.value / n) * (n - 1) : Math.floor(it.value / n),
        phase: 0, sx: 0, sy: 0,
      });
    }
    for (let i = 0; i < 10; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 200);
      st.sparks.push({ x: it.x, y: it.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: rand(0.3, 0.55), size: rand(4, 9), color: it.golden ? "#FFD54F" : "#fff" });
    }
    sfx.coin();
  }

  function addText(text, x, y, size, color, praise) {
    st.texts.push({ text, x, y, size, color, praise: !!praise, t: 0, life: praise ? 0.9 : 0.75 });
  }

  function confettiBurst(x, y, n, power) {
    for (let i = 0; i < n; i++) {
      const a = rand(-Math.PI, 0), sp = rand(250, 650) * (power || 1);
      st.confetti.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rand(0, 6), vr: rand(-10, 10),
        w: rand(6, 11), h: rand(10, 16), color: CONFETTI_COLORS[randInt(0, CONFETTI_COLORS.length - 1)], t: 0, life: rand(1.6, 2.4),
      });
    }
  }

  // ---------------------------------------------------------------- input
  function pointerPos(e) { return { x: e.clientX, y: e.clientY }; }

  function hitTest(ax, ay, bx, by, pad) {
    if (st.mode !== "play" && st.mode !== "unlock" && st.mode !== "intro") return;
    for (const it of st.items) {
      if (it.state !== "fly" && it.state !== "hover") continue;
      if (segDist(it.x, it.y, ax, ay, bx, by) < itemR + pad) scanItem(it, false);
    }
  }

  cv.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    unlockAudio();
    const p = pointerPos(e);
    st.lastInput = st.time;
    if (st.mode === "intro") beginPlay();
    if (st.mode === "finale") { tapChest(false); return; }
    st.stroke = { x: p.x, y: p.y, count: 0 };
    st.trail.push({ x: p.x, y: p.y, t: st.time });
    hitTest(p.x, p.y, p.x, p.y, itemSize * 0.28);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* not critical */ }
  });
  cv.addEventListener("pointermove", (e) => {
    if (!st.stroke) return;
    e.preventDefault();
    const p = pointerPos(e);
    st.lastInput = st.time;
    hitTest(st.stroke.x, st.stroke.y, p.x, p.y, itemSize * 0.2);
    st.stroke.x = p.x; st.stroke.y = p.y;
    st.trail.push({ x: p.x, y: p.y, t: st.time });
  });
  const endStroke = () => { st.stroke = null; };
  cv.addEventListener("pointerup", endStroke);
  cv.addEventListener("pointercancel", endStroke);
  document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

  $("mute").addEventListener("click", () => {
    muted = !muted;
    $("mute").textContent = muted ? "🔇" : "🔊";
    if (master) master.gain.value = muted ? 0 : 0.5;
  });
  $("getBtn").addEventListener("click", openStore);
  $("cta").addEventListener("click", openStore);
  $("replay").addEventListener("click", () => { unlockAudio(); reset(); beginPlay(); });
  $("playBtn").addEventListener("click", () => { unlockAudio(); reset(); beginPlay(); st.lastInput = st.time; });

  // ---------------------------------------------------------------- flow
  function beginPlay() {
    if (st.interacted) return;
    st.interacted = true;
    st.mode = "play";
    st.playStart = st.time;
    st.lastInput = st.time;
    st.nextWave = st.time + 1.2;
    st.hand = null;
    headline.classList.add("hide");
  }

  function startUnlock() {
    st.mode = "unlock";
    st.unl = { t: 0, idx: st.tier };
    confettiBurst(W / 2, L.playTop + L.ph * 0.45, 90, 1);
    sfx.unlock();
    st.shake = 8;
    st.hand = null;
  }

  function finishUnlock() {
    const i = st.unl.idx;
    slots[i].style.backgroundImage = "url(" + cards.url[i] + ")";
    slots[i].classList.add("filled");
    st.unlocked.push(REWARDS[i]);
    st.tier++;
    st.unl = null;
    st.lastInput = st.time;
    updateGoal();
    if (st.tier >= TIERS.length) { startFinale(); return; }
    st.mode = "play";
    st.nextWave = st.time + 0.35;
  }

  function startFinale() {
    if (st.mode === "finale" || st.mode === "end") return;
    st.pending = [];
    st.hand = null;
    st.stroke = null;
    if (!st.unlocked.length) { showEnd(true); return; }
    st.mode = "finale";
    st.fin = { t: 0, landed: false, taps: 0, lastTap: st.time, open: false, openT: 0, shake: 0 };
  }

  function tapChest(auto) {
    const f = st.fin;
    if (!f || !f.landed || f.open) return;
    f.taps++;
    f.shake = 0.35;
    f.lastTap = st.time;
    if (!auto) st.lastInput = st.time;
    sfx.crack();
    st.shake = 5 + f.taps * 2;
    const c = chestGeom();
    for (let i = 0; i < 8; i++) st.sparks.push({ x: c.cx + rand(-c.w / 2, c.w / 2), y: c.seamY, vx: rand(-60, 60), vy: rand(-180, -60), t: 0, life: 0.5, size: rand(5, 9), color: "#FFE27A" });
    if (f.taps >= 3) {
      f.open = true;
      confettiBurst(c.cx, c.seamY, 180, 1.3);
      sfx.fanfare();
      st.shake = 14;
    }
  }

  function showEnd(teaser) {
    st.mode = "end";
    st.hand = null;
    const total = st.unlocked.reduce((a, r) => a + r.value, 0);
    const allTotal = REWARDS.reduce((a, r) => a + r.value, 0);
    const wallet = $("endWallet");
    wallet.innerHTML = "";
    REWARDS.forEach((r, i) => {
      const img = document.createElement("img");
      const have = !teaser && st.unlocked.indexOf(r) >= 0;
      img.src = have ? cards.url[i] : cards.lockedUrl[i];
      if (!have) img.className = "locked";
      wallet.appendChild(img);
    });
    if (teaser) {
      $("endTitle").innerHTML = "🔒 <em>$" + allTotal + "</em> in rewards waiting";
      $("endSub").textContent = "Swipe your groceries to scan them and unlock gift cards!";
      $("endSub").classList.remove("hidden");
      $("playBtn").classList.remove("hidden");
      $("replay").classList.add("hidden");
      $("nextGoal").classList.add("hidden");
    } else {
      $("endTitle").innerHTML = "You unlocked <em>$" + total + "</em> in rewards!";
      $("endSub").classList.add("hidden");
      $("playBtn").classList.add("hidden");
      $("replay").classList.remove("hidden");
      const next = REWARDS.find((r) => st.unlocked.indexOf(r) < 0) || NEXT_TEASE;
      $("nextGoal").textContent = "🔒 Next goal: " + rewardLabel(next);
      $("nextGoal").classList.remove("hidden");
    }
    $("cta").textContent = CONFIG.ctaText;
    endEl.classList.add("show");
  }

  // ---------------------------------------------------------------- hand pointer (tutorial / hints)
  function handSwipe(target, period) {
    const p = (st.time % period) / period;
    const ax = target.x - itemSize * 1.1, ay = target.y + itemSize * 0.35;
    const bx = target.x + itemSize * 1.1, by = target.y - itemSize * 0.2;
    const m = clamp(p / 0.45, 0, 1);
    const e = easeInOut(m);
    const h = { x: lerp(ax, bx, e), y: lerp(ay, by, e), alpha: p < 0.05 ? p / 0.05 : p > 0.75 ? Math.max(0, 1 - (p - 0.75) / 0.2) : 1, press: m > 0 && m < 1, p: m };
    if (h.press) st.trail.push({ x: h.x, y: h.y, t: st.time, demo: true });
    return h;
  }

  function nearestItem() {
    let best = null, bd = 1e9;
    for (const it of st.items) {
      if (it.state !== "fly" && it.state !== "hover") continue;
      if (it.y > L.playBottom - itemSize * 0.5 || it.y < L.playTop) continue;
      const d = Math.abs(it.x - W / 2) + Math.abs(it.y - L.introY);
      if (d < bd) { bd = d; best = it; }
    }
    return best;
  }

  // ---------------------------------------------------------------- update
  function update(dt) {
    const t = st.time;

    if (st.mode === "intro") {
      st.introT += dt;
      const hover = st.items.find((i) => i.hover && (i.state === "hover" || i.state === "fly"));
      if (!hover && t >= st.respawnAt && !st.items.some((i) => i.state === "scan")) {
        throwItem({ apexT: 0.8, apexY: L.introY, x: W / 2, hover: true });
        st.respawnAt = Infinity;
      }
      if (hover && hover.state === "hover") {
        st.hand = handSwipe(hover, 1.7);
        if (!st.demoDone && st.introT >= CONFIG.demoScanAt && st.hand.p > 0.45 && st.hand.p < 0.6) {
          scanItem(hover, true);
          st.demoDone = true;
          st.respawnAt = t + 1.1;
        }
      } else if (!hover) {
        st.hand = null;
      }
      if (st.introT >= CONFIG.idleTeaserAt) showEnd(true);
    } else if (st.mode === "play") {
      const idle = t - st.lastInput;
      if (idle > CONFIG.hintAfter) {
        const n = nearestItem();
        st.hand = n ? handSwipe(n, 1.5) : null;
      } else st.hand = null;
      if (idle > CONFIG.idleFinaleAfter || t - st.playStart > CONFIG.maxPlayTime) startFinale();
      const active = st.items.filter((i) => i.state === "fly" || i.state === "hover").length;
      if (active === 0 && !st.pending.length) st.nextWave = Math.min(st.nextWave, t + 0.3);
      if (t >= st.nextWave && !st.pending.length) { launchWave(); st.nextWave = t + 2.6; }
      if (st.tier < TIERS.length && st.shown >= TIERS[st.tier].goal) startUnlock();
    } else if (st.mode === "unlock") {
      st.unl.t += dt;
      if (st.unl.t >= 1.35) finishUnlock();
    } else if (st.mode === "finale") {
      const f = st.fin;
      f.t += dt;
      f.shake = Math.max(0, f.shake - dt);
      if (!f.landed && f.t >= 0.6) { f.landed = true; f.lastTap = t; st.shake = 6; sfx.crack(); }
      if (f.landed && !f.open) {
        const wait = t - f.lastTap;
        if (wait > 1.0) { const c = chestGeom(); st.hand = { x: c.cx + c.w * 0.1, y: c.seamY + c.w * 0.05, alpha: 1, press: wait % 0.6 < 0.2, tap: true }; }
        else st.hand = null;
        if (wait > (f.taps === 0 ? 2.0 : 0.6)) tapChest(true);
      }
      if (f.open) {
        st.hand = null;
        f.openT += dt;
        if (f.openT > 0.6 + st.unlocked.length * 0.3 + 1.7) showEnd(false);
      }
    }

    // pending throws
    for (let i = st.pending.length - 1; i >= 0; i--) {
      const p = st.pending[i];
      p.delay -= dt;
      if (p.delay <= 0) { throwItem(p); st.pending.splice(i, 1); }
    }

    // items (slow motion during unlock)
    const idt = st.mode === "unlock" ? dt * 0.15 : dt;
    for (let i = st.items.length - 1; i >= 0; i--) {
      const it = st.items[i];
      it.t += it.state === "scan" ? dt : idt;
      if (it.state === "fly") {
        it.x += it.vx * idt; it.vy += it.g * idt; it.y += it.vy * idt; it.rot += it.vr * idt;
        if (it.hover && it.vy >= 0) { it.state = "hover"; it.t = 0; it.baseY = it.y; }
        if (it.vy > 0 && it.y > L.bagTop + itemSize * 0.6) st.items.splice(i, 1);
      } else if (it.state === "hover") {
        it.y = it.baseY + Math.sin(it.t * 3) * 5; it.rot += it.vr * idt * 0.3;
        if (st.mode === "finale") { it.state = "fly"; it.hover = false; it.vy = 0; }
      } else if (it.state === "scan" && it.t >= 0.42) {
        burstItem(it);
        st.items.splice(i, 1);
      }
    }

    // coins → points counter
    for (let i = st.coins.length - 1; i >= 0; i--) {
      const c = st.coins[i];
      if (c.delay > 0) { c.delay -= dt; continue; }
      c.t += dt;
      if (c.phase === 0) {
        c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.9; c.vy *= 0.9;
        if (c.t > 0.18) { c.phase = 1; c.t = 0; c.sx = c.x; c.sy = c.y; }
      } else {
        const p = Math.min(1, c.t / 0.45), e = p * p;
        const cx = (c.sx + c.tx) / 2 + 60, cy = Math.min(c.sy, c.ty) - 40;
        c.x = (1 - e) * (1 - e) * c.sx + 2 * (1 - e) * e * cx + e * e * c.tx;
        c.y = (1 - e) * (1 - e) * c.sy + 2 * (1 - e) * e * cy + e * e * c.ty;
        if (p >= 1) {
          st.shown += c.value;
          ptsEl.classList.add("bump");
          clearTimeout(ptsEl._bt);
          ptsEl._bt = setTimeout(() => ptsEl.classList.remove("bump"), 70);
          if (i % 3 === 0) tone(2093, 0.04, "sine", 0.05);
          st.coins.splice(i, 1);
        }
      }
    }

    // particles
    for (let i = st.texts.length - 1; i >= 0; i--) { const x = st.texts[i]; x.t += dt; x.y -= (x.praise ? 30 : 60) * dt; if (x.t > x.life) st.texts.splice(i, 1); }
    for (let i = st.sparks.length - 1; i >= 0; i--) { const s = st.sparks[i]; s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.92; s.vy *= 0.92; if (s.t > s.life) st.sparks.splice(i, 1); }
    const grav = H * 1.1;
    for (let i = st.confetti.length - 1; i >= 0; i--) {
      const c = st.confetti[i]; c.t += dt;
      c.vy += grav * dt; c.vx *= 0.985; c.vy *= 0.985; c.vy = Math.min(c.vy, 260);
      c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      if (c.t > c.life || c.y > H + 20) st.confetti.splice(i, 1);
    }
    st.trail = st.trail.filter((p) => t - p.t < (p.demo ? 0.25 : 0.14));

    st.shake = Math.max(0, st.shake - dt * 40);
    st.bagPop = Math.max(0, st.bagPop - dt * 5);

    // HUD
    st.display += (st.shown - st.display) * Math.min(1, dt * 14);
    if (Math.abs(st.shown - st.display) < 1) st.display = st.shown;
    const shownTxt = Math.round(st.display).toLocaleString("en-US");
    if (ptsNum.textContent !== shownTxt) ptsNum.textContent = shownTxt;
    const ti = Math.min(st.tier, TIERS.length - 1);
    const prev = ti > 0 ? TIERS[ti - 1].goal : 0;
    const frac = st.tier >= TIERS.length ? 1 : clamp((st.display - prev) / (TIERS[ti].goal - prev), 0, 1);
    barFill.style.width = (frac * 100).toFixed(1) + "%";
  }

  // ---------------------------------------------------------------- draw
  function drawBag() {
    const w = L.bagW, h = L.bagH, x = L.bagX - w / 2, y = L.bagTop;
    const sy = 1 + st.bagPop * 0.06;
    const fade = st.fin ? Math.max(0, 1 - st.fin.t * 3) : 1;
    if (fade <= 0) return;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(L.bagX, L.bagBottom); ctx.scale(1 / sy, sy); ctx.translate(-L.bagX, -L.bagBottom);
    ctx.lineWidth = Math.max(2, w * 0.015); ctx.strokeStyle = "#8A6235"; ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w * 0.94, y + h); ctx.lineTo(x + w * 0.06, y + h); ctx.closePath();
    ctx.fillStyle = "#D9B382"; ctx.fill(); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) ctx.lineTo(x + (w * i) / 10, y + (i % 2 ? h * 0.06 : 0));
    ctx.lineTo(x + w, y + h * 0.16); ctx.lineTo(x, y + h * 0.16); ctx.closePath();
    ctx.fillStyle = "#C49A64"; ctx.fill();
    if (logoImg.complete && logoImg.naturalWidth) {
      const ls = h * 0.62;
      ctx.save(); ctx.globalAlpha = 0.95;
      rr(ctx, L.bagX - ls / 2, y + h * 0.27, ls, ls, ls * 0.18); ctx.fillStyle = "#fff"; ctx.fill();
      ctx.drawImage(logoImg, L.bagX - ls * 0.46, y + h * 0.27 + ls * 0.04, ls * 0.92, ls * 0.92);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawStar(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4, rad = i % 2 ? r * 0.35 : r;
      ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawItem(it) {
    const sp = sprite(it.type, it.golden);
    if (it.golden && it.state !== "scan") {
      const pulse = 0.8 + 0.2 * Math.sin(st.time * 8);
      const g = ctx.createRadialGradient(it.x, it.y, 0, it.x, it.y, itemSize * 0.8 * pulse);
      g.addColorStop(0, "rgba(255,213,79,.85)"); g.addColorStop(1, "rgba(255,213,79,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(it.x, it.y, itemSize * 0.8, 0, Math.PI * 2); ctx.fill();
      for (let k = 0; k < 4; k++) {
        const a = st.time * 2 + (k * Math.PI) / 2;
        drawStar(it.x + Math.cos(a) * itemSize * 0.62, it.y + Math.sin(a) * itemSize * 0.62, itemSize * 0.09, "#fff");
      }
    }
    let scale = 1;
    if (it.state === "scan") {
      const t = it.t;
      scale = t < 0.3 ? 1 + 0.08 * Math.sin((t / 0.3) * Math.PI) : 1 - (t - 0.3) / 0.12;
      scale = Math.max(0, scale);
    }
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.state === "scan" ? 0 : it.rot);
    ctx.scale(scale, scale);
    ctx.drawImage(sp.cnv, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
    ctx.restore();
    if (it.state === "scan") drawScanFx(it);
  }

  function drawScanFx(it) {
    const t = it.t, b = itemSize * 0.56;
    const k = t < 0.1 ? 1.7 - 0.7 * (t / 0.1) : 1;
    const hb = b * k, cl = b * 0.38;
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.globalAlpha = t > 0.34 ? Math.max(0, 1 - (t - 0.34) / 0.08) : 1;
    ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(3, itemSize * 0.06); ctx.lineCap = "square";
    [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([sx, sy]) => {
      ctx.beginPath();
      ctx.moveTo(sx * hb, sy * hb - sy * cl); ctx.lineTo(sx * hb, sy * hb); ctx.lineTo(sx * hb - sx * cl, sy * hb);
      ctx.stroke();
    });
    if (t > 0.05 && t < 0.3) {
      const p = (t - 0.05) / 0.25, ly = -hb + 2 * hb * p;
      ctx.fillStyle = "rgba(255,40,40,.25)"; ctx.fillRect(-hb * 1.1, ly - 7, hb * 2.2, 14);
      ctx.fillStyle = "#FF2A2A"; ctx.fillRect(-hb * 1.1, ly - 2, hb * 2.2, 4);
      ctx.fillStyle = "#fff"; ctx.fillRect(-hb * 1.1, ly - 0.5, hb * 2.2, 1);
    }
    if (t > 0.22) {
      const p = easeOutBack(Math.min(1, (t - 0.22) / 0.12));
      const r = itemSize * 0.24 * p;
      ctx.fillStyle = "#1D9B81"; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = r * 0.22; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(-r * 0.45, 0); ctx.lineTo(-r * 0.1, r * 0.35); ctx.lineTo(r * 0.5, -r * 0.35); ctx.stroke();
    }
    ctx.restore();
  }

  function drawTrail() {
    const pts = st.trail;
    if (pts.length < 2) return;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      if (b.t - a.t > 0.1 || !!a.demo !== !!b.demo) continue;
      const life = b.demo ? 0.25 : 0.14;
      const k = 1 - (st.time - b.t) / life;
      if (k <= 0) continue;
      ctx.strokeStyle = "rgba(255,40,40," + 0.28 * k + ")"; ctx.lineWidth = 18 * k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = "rgba(255,42,42," + k + ")"; ctx.lineWidth = 7 * k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255," + k + ")"; ctx.lineWidth = 2.5 * k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.restore();
  }

  function drawCoin(x, y, r) {
    ctx.fillStyle = "#C98F00"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#F3B100"; ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FFE27A"; ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.3, 0, Math.PI * 2); ctx.fill();
  }

  function outlinedText(text, x, y, size, fill, alpha, scale) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.font = "800 " + size + "px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineJoin = "round"; ctx.lineWidth = size * 0.18; ctx.strokeStyle = "#0F3146";
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = fill; ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function drawRays(cx, cy, R, alpha, rot) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, "rgba(255,236,150," + alpha + ")"); g.addColorStop(1, "rgba(255,236,150,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    for (let i = 0; i < 12; i++) { const a = (i * Math.PI * 2) / 12; ctx.moveTo(0, 0); ctx.arc(0, 0, R, a, a + Math.PI / 12); ctx.closePath(); }
    ctx.fill();
    ctx.restore();
  }

  function drawCardAt(cnv, x, y, w, sx, glow) {
    const h = (w * CARD_H) / CARD_W;
    ctx.save();
    ctx.translate(x, y); ctx.scale(sx, 1);
    if (glow) { ctx.shadowColor = "rgba(255,200,0,.9)"; ctx.shadowBlur = 30 * glow; }
    else { ctx.shadowColor = "rgba(15,49,70,.35)"; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4; }
    ctx.drawImage(cnv, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawUnlock() {
    const u = st.unl, t = u.t;
    const a = t < 0.15 ? t / 0.15 : t > 1.0 ? Math.max(0, 1 - (t - 1.0) / 0.3) : 1;
    ctx.fillStyle = "rgba(15,49,70," + 0.4 * a + ")"; ctx.fillRect(0, 0, W, H);
    const cw = Math.min(W * 0.66, 320), cx = W / 2, cy = L.playTop + L.ph * 0.45;
    if (t < 1.05) drawRays(cx, cy, cw * 0.95, 0.65 * a, st.time * 0.8);
    let x = cx, y = cy, w = cw, flip = 1;
    if (t < 0.4) {
      const p = easeOutBack(t / 0.4);
      w = cw * Math.max(0.01, p);
      flip = Math.cos((1 - Math.min(1, t / 0.4)) * Math.PI * 2);
    } else if (t < 1.0) {
      w = cw * (1 + 0.03 * Math.sin((t - 0.4) * 12));
    } else {
      const p = easeInOut(Math.min(1, (t - 1.0) / 0.35));
      const slot = rectCenter(slots[u.idx]);
      x = lerp(cx, slot.x, p); y = lerp(cy, slot.y, p); w = lerp(cw, slot.w, p);
    }
    drawCardAt(flip < 0 ? cards.back : cards.front[u.idx], x, y, w, Math.max(0.05, Math.abs(flip)), REWARDS[u.idx].gold ? 1 : 0);
    if (t > 0.15 && t < 1.0) {
      const p = Math.min(1, (t - 0.15) / 0.2);
      outlinedText("UNLOCKED!", cx, cy - cw * 0.48, cw * 0.15, "#FFD54F", a, easeOutBack(p));
    }
  }

  function chestGeom() {
    const w = Math.min(W * 0.6, L.ph * 0.5, 280);
    const f = st.fin;
    const cy = L.playTop + L.ph * 0.7;
    const p = f ? Math.min(1, f.t / 0.6) : 1;
    const y = lerp(-w, cy, easeOutBounce(p));
    return { cx: W / 2, cy: y, w, seamY: y - w * 0.04 };
  }

  function drawChest() {
    const f = st.fin, g0 = chestGeom();
    const sh = f.shake > 0 ? Math.sin(st.time * 60) * f.shake * 18 : 0;
    const cx = g0.cx + sh, cy = g0.cy, w = g0.w, h = w * 0.7;
    const bodyTop = cy - h * 0.05, bodyH = h * 0.55, lidH = h * 0.38;
    const x = cx - w / 2;

    if (f.open) drawRays(cx, bodyTop, w * 1.6, Math.min(0.9, f.openT * 2), st.time * 0.6);
    else if (f.taps > 0) drawRays(cx, bodyTop, w * (0.6 + f.taps * 0.25), 0.25 * f.taps, st.time * 0.6);

    ctx.save();
    ctx.lineWidth = Math.max(3, w * 0.025); ctx.strokeStyle = "#2B1450"; ctx.lineJoin = "round";
    // body
    let g = ctx.createLinearGradient(0, bodyTop, 0, bodyTop + bodyH);
    g.addColorStop(0, "#8A5BD6"); g.addColorStop(1, "#4B2A8C");
    rr(ctx, x, bodyTop, w, bodyH, w * 0.05); ctx.fillStyle = g; ctx.fill(); ctx.stroke();
    if (f.open) {
      const gg = ctx.createRadialGradient(cx, bodyTop, 0, cx, bodyTop, w * 0.5);
      gg.addColorStop(0, "rgba(255,240,170,1)"); gg.addColorStop(1, "rgba(255,240,170,0)");
      ctx.fillStyle = gg; ctx.fillRect(x, bodyTop - w * 0.2, w, w * 0.4);
    }
    ctx.fillStyle = "#F3B100";
    [0.18, 0.82].forEach((fx) => { rr(ctx, x + w * fx - w * 0.05, bodyTop, w * 0.1, bodyH, w * 0.02); ctx.fill(); ctx.stroke(); });
    // lid
    const lift = f.open ? Math.min(1, f.openT / 0.25) : 0;
    ctx.save();
    if (f.open) ctx.globalAlpha = Math.max(0, 1 - Math.max(0, f.openT - 0.2) / 0.3);
    ctx.translate(cx + lift * w * 0.9, bodyTop - lidH / 2 - lift * h * 0.9);
    ctx.rotate(-0.9 * lift);
    g = ctx.createLinearGradient(0, -lidH / 2, 0, lidH / 2);
    g.addColorStop(0, "#A47AE8"); g.addColorStop(1, "#6A3FB5");
    ctx.beginPath();
    ctx.moveTo(-w / 2, lidH / 2); ctx.lineTo(-w / 2, -lidH * 0.05);
    ctx.quadraticCurveTo(-w / 2, -lidH / 2, -w * 0.32, -lidH / 2); ctx.lineTo(w * 0.32, -lidH / 2);
    ctx.quadraticCurveTo(w / 2, -lidH / 2, w / 2, -lidH * 0.05); ctx.lineTo(w / 2, lidH / 2); ctx.closePath();
    ctx.fillStyle = g; ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#F3B100";
    [-0.32, 0.32].forEach((fx) => { ctx.fillRect(w * fx - w * 0.05, -lidH / 2 + 2, w * 0.1, lidH - 2); ctx.strokeRect(w * fx - w * 0.05, -lidH / 2 + 2, w * 0.1, lidH - 2); });
    ctx.restore();
    // lock plate
    if (!f.open) {
      rr(ctx, cx - w * 0.09, bodyTop - h * 0.06, w * 0.18, h * 0.22, w * 0.03); ctx.fillStyle = "#FFD54F"; ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2B1450"; ctx.beginPath(); ctx.arc(cx, bodyTop + h * 0.03, w * 0.025, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(cx - w * 0.012, bodyTop + h * 0.03, w * 0.024, h * 0.07);
    }
    // seam glow while cracking
    if (!f.open && f.taps > 0) {
      ctx.strokeStyle = "rgba(255,230,120," + (0.4 + 0.2 * f.taps) + ")"; ctx.lineWidth = 3 + f.taps * 3;
      ctx.beginPath(); ctx.moveTo(x + 6, bodyTop); ctx.lineTo(x + w - 6, bodyTop); ctx.stroke();
    }
    ctx.restore();

    if (f.landed && !f.open) outlinedText("Tap to open!", cx, cy + h * 0.72, Math.max(22, w * 0.13), "#fff", 1, 1 + 0.05 * Math.sin(st.time * 6));

    // gift cards fly out and flip
    if (f.open) {
      const n = st.unlocked.length;
      const cw = Math.min(W * 0.92 / (n * 1.08), 140);
      const ty = bodyTop - h * 0.5 - (cw * CARD_H) / CARD_W * 0.9;
      st.unlocked.forEach((r, i) => {
        const tt = f.openT - 0.3 - i * 0.3;
        if (tt <= 0) return;
        const p = easeOutBack(Math.min(1, tt / 0.35));
        const tx = W / 2 + (i - (n - 1) / 2) * cw * 1.08;
        const px = lerp(cx, tx, p), py = lerp(bodyTop, ty, p);
        const fl = Math.min(1, Math.max(0, (tt - 0.2) / 0.3));
        const sx = Math.abs(Math.cos(fl * Math.PI));
        const idx = REWARDS.indexOf(r);
        const glow = r.gold && fl >= 1 ? 0.7 + 0.3 * Math.sin(st.time * 6) : 0;
        drawCardAt(fl < 0.5 ? cards.back : cards.front[idx], px, py, cw * Math.max(0.2, p), Math.max(0.05, sx), glow);
      });
    }
  }

  function drawHand(h) {
    const size = itemSize * 0.75;
    ctx.save();
    ctx.globalAlpha = h.alpha;
    if (h.press) {
      ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(h.x, h.y, size * 0.3, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.translate(h.x, h.y);
    const s = h.press ? 0.9 : 1;
    ctx.scale(s, s);
    ctx.font = size + "px " + EMOJI_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.shadowColor = "rgba(0,0,0,.3)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
    ctx.fillText("👆", size * 0.08, -size * 0.06);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (st.shake > 0) ctx.translate(rand(-st.shake, st.shake), rand(-st.shake, st.shake));

    for (const it of st.items) if (it.state !== "scan") drawItem(it);
    drawBag();
    for (const it of st.items) if (it.state === "scan") drawItem(it);

    if (st.mode === "intro" || (st.mode === "play" && st.hand)) {
      const hv = st.items.find((i) => i.state === "hover") || (st.hand && nearestItem());
      if (hv && st.hand) outlinedText("Swipe to scan!", W / 2, Math.min(hv.y + itemSize * 1.0, L.playBottom - 14), Math.max(20, itemSize * 0.3), "#fff", st.hand.alpha * 0.5 + 0.5, 1 + 0.04 * Math.sin(st.time * 6));
    }

    drawTrail();
    for (const s of st.sparks) { const k = 1 - s.t / s.life; drawStar(s.x, s.y, s.size * k, s.color); }

    ctx.restore();

    if (st.mode === "unlock") drawUnlock();
    if (st.mode === "finale" || (st.mode === "end" && st.fin)) drawChest();

    for (const c of st.coins) if (c.delay <= 0) drawCoin(c.x, c.y, Math.max(6, itemSize * 0.085));
    for (const c of st.confetti) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (c.life - c.t) / 0.4);
      ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(1, Math.abs(Math.cos(c.rot * 1.3)));
      ctx.fillStyle = c.color; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
    for (const x of st.texts) {
      const p = x.t / x.life;
      const sc = x.t < 0.15 ? easeOutBack(x.t / 0.15) : 1;
      outlinedText(x.text, x.x, x.y, x.size, x.color, p > 0.6 ? 1 - (p - 0.6) / 0.4 : 1, sc);
    }
    if (st.hand && st.mode !== "end") drawHand(st.hand);
  }

  // ---------------------------------------------------------------- boot
  let last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    const now = ts / 1000;
    const dt = Math.min(0.05, last ? now - last : 0.016);
    last = now;
    st.time += dt;
    try {
      update(dt);
      draw();
    } catch (e) {
      (window.__ncpErrors = window.__ncpErrors || []).push(String(e && e.stack || e));
    }
  }

  function whenFontsReady(cb) {
    let done = false;
    const go = () => { if (!done) { done = true; cb(); } };
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load("800 20px Poppins"), document.fonts.load("600 20px Poppins")]).then(go, go);
      setTimeout(go, 900);
    } else go();
  }

  function start() {
    whenFontsReady(() => {
      const begin = () => {
        buildCards();
        layout();
        reset();
        requestAnimationFrame(frame);
      };
      if (logoImg.complete) begin(); else { logoImg.onload = logoImg.onerror = begin; }
    });
  }

  window.addEventListener("resize", () => { if (st) layout(); });
  window.__ncp = { state: () => st, layout: () => L };  // debug/QA hook

  // AppLovin/Unity: wait for MRAID to be ready before starting.
  if (window.mraid && window.mraid.getState && window.mraid.getState() === "loading") {
    window.mraid.addEventListener("ready", start);
  } else {
    start();
  }
})();

</script>
</body>
</html>
